# Permalinks
#
# Use of `relative_permalinks` ensures post links from the index work properly.
permalink:           pretty

# Setup
title:               Ron Boger
# tagline:             'personal site + musings'
tagline:             ''
description:         'Notes on biology, computation, science, and other things.'
url:                 https://ronboger.com
baseurl:             ''
paginate:            5

# About/contact
author:
  name:              Ron Boger
  url:               https://ronboger.com
  email:             ronnyb@jhu.edu

# Custom vars
version:             1.0.0

plugins:
  - jekyll-paginate
  - jekyll-redirect-from


gems: [jekyll-paginate]
paginate: 2
paginate_path: "page:num"

# Previous Now updates, published separately from the writing archive.
collections:
  nowArchives:
    output: true
    permalink: /now/archive/:name/
