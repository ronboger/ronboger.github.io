<!doctype html>
<html lang="en">
  {% include head.html %}
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#now">now</a>
          <a href="{{ '/' | relative_url }}#work">work</a>
          <a href="{{ '/' | relative_url }}#writing">writing</a>
          <a href="{{ '/' | relative_url }}#elsewhere">elsewhere</a>
        </nav>
      </header>

      {% if page.body_class == 'home' %}
        {{ content }}
      {% else %}
        <main id="main-content" class="content-page">
          {{ content }}
        </main>
      {% endif %}

      <footer class="site-footer" id="elsewhere">
        <nav class="elsewhere-links" aria-label="External profiles and contact">
          <a href="mailto:ronnyb@jhu.edu">email</a>
          <span aria-hidden="true">·</span>
          <a href="https://scholar.google.com/citations?user=qU-JFvMAAAAJ&amp;hl=en">scholar</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/ronboger/">github</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.linkedin.com/in/ronboger">linkedin</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.goodreads.com/user/show/69825193-ron-boger">goodreads</a>
        </nav>
        <span class="location">Berkeley, California</span>
      </footer>
    </div>
  </body>
</html>
